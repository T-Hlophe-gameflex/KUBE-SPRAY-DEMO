---
- name: Check cluster connectivity
  command: kubectl cluster-info
  register: cluster_info

- name: Get cluster nodes
  command: kubectl get nodes
  register: nodes_info

- name: Display cluster info
  debug:
    msg: |
      Cluster Status:
      {{ cluster_info.stdout }}
      
      Nodes:
      {{ nodes_info.stdout }}

- name: Check if applications are running
  command: kubectl get pods -n default
  register: pods_info
  ignore_errors: true

- name: Display application status
  debug:
    msg: |
      Application Status:
      {{ pods_info.stdout if pods_info.rc == 0 else 'No applications deployed' }}

- name: Check ELK stack services
  command: kubectl get svc elasticsearch logstash kibana
  register: elk_services
  ignore_errors: true

- name: Check Elasticsearch health
  command: kubectl exec deployment/elasticsearch -- curl -s http://localhost:9200/_cluster/health
  register: es_health
  ignore_errors: true

- name: Check Kibana health
  command: kubectl exec deployment/kibana -- curl -s http://localhost:5601/api/status
  register: kibana_health
  ignore_errors: true

- name: Display ELK stack status
  debug:
    msg: |
      ELK Stack Status:
      Services:
      {{ elk_services.stdout if elk_services.rc == 0 else 'ELK services not found' }}
      
      Elasticsearch Health: {{ 'Available' if es_health.rc == 0 else 'Not available' }}
      Kibana Health: {{ 'Available' if kibana_health.rc == 0 else 'Not available' }}

- name: Check for any failed pods
  command: kubectl get pods -n default --field-selector=status.phase!=Running
  register: failed_pods
  ignore_errors: true

- name: Report cluster health summary
  debug:
    msg: |
      Cluster Health Summary:
      - Cluster API: {{ 'Accessible' if cluster_info.rc == 0 else 'Not accessible' }}
      - Nodes: {{ nodes_info.stdout_lines | length - 1 }} node(s) ready
      - Failed Pods: {{ failed_pods.stdout_lines | length - 1 if failed_pods.rc == 0 else 0 }}
      - ELK Stack: {{ 'Running' if elk_services.rc == 0 else 'Not deployed' }}
      
      Service Access Points:
      - Demo Application: http://localhost:30080
      - API Health Endpoint: http://localhost:30081/health
      - Kibana Dashboard: http://localhost:30601