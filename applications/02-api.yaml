apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: default
data:
  DATABASE_URL: "postgresql://demouser:demopass123@postgres-service:5432/demoapp"
  PORT: "3000"
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: default
  labels:
    app: api-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
        tier: backend
    spec:
      containers:
      - name: api
        image: node:16-alpine
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: api-config
        command:
        - /bin/sh
        - -c
        - |
          # Create a simple Node.js API
          cat > package.json << 'EOF'
          {
            "name": "demo-api",
            "version": "1.0.0",
            "main": "server.js",
            "dependencies": {
              "express": "^4.18.2",
              "pg": "^8.11.0",
              "cors": "^2.8.5"
            }
          }
          EOF
          
          cat > server.js << 'EOF'
          const express = require('express');
          const { Pool } = require('pg');
          const cors = require('cors');
          
          const app = express();
          app.use(cors());
          app.use(express.json());
          
          const pool = new Pool({
            connectionString: process.env.DATABASE_URL
          });
          
          // Initialize database
          async function initDb() {
            try {
              await pool.query(`
                CREATE TABLE IF NOT EXISTS messages (
                  id SERIAL PRIMARY KEY,
                  content TEXT NOT NULL,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                )
              `);
              console.log('Database initialized');
            } catch (err) {
              console.error('Database init error:', err);
            }
          }
          
          // Routes
          app.get('/health', (req, res) => {
            res.json({ status: 'healthy', timestamp: new Date().toISOString() });
          });
          
          app.get('/api/messages', async (req, res) => {
            try {
              const result = await pool.query('SELECT * FROM messages ORDER BY created_at DESC LIMIT 10');
              res.json(result.rows);
            } catch (err) {
              res.status(500).json({ error: err.message });
            }
          });
          
          app.post('/api/messages', async (req, res) => {
            try {
              const { content } = req.body;
              const result = await pool.query(
                'INSERT INTO messages (content) VALUES ($1) RETURNING *',
                [content]
              );
              res.json(result.rows[0]);
            } catch (err) {
              res.status(500).json({ error: err.message });
            }
          });
          
          const PORT = process.env.PORT || 3000;
          
          initDb().then(() => {
            app.listen(PORT, '0.0.0.0', () => {
              console.log(`API server running on port ${PORT}`);
            });
          });
          EOF
          
          npm install --production
          node server.js
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
  labels:
    app: api-backend
    tier: backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: api-backend