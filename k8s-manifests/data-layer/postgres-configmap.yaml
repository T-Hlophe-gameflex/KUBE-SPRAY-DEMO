apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: database
data:
  postgres.conf: |
    # Enhanced PostgreSQL configuration for production logging
    log_destination = 'stderr'
    log_statement = 'all'
    log_duration = on
    log_min_duration_statement = 100
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = 0
    log_error_verbosity = verbose
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    shared_preload_libraries = ''
    
  init.sql: |
    -- Create databases for different services
    CREATE DATABASE orderdb;
    CREATE DATABASE userdb;
    CREATE DATABASE inventorydb;
    
    -- Create users
    CREATE USER orderuser WITH ENCRYPTED PASSWORD 'orderpass123';
    CREATE USER userservice WITH ENCRYPTED PASSWORD 'userpass123';
    CREATE USER inventoryservice WITH ENCRYPTED PASSWORD 'inventorypass123';
    
    -- Grant permissions
    GRANT ALL PRIVILEGES ON DATABASE orderdb TO orderuser;
    GRANT ALL PRIVILEGES ON DATABASE userdb TO userservice;
    GRANT ALL PRIVILEGES ON DATABASE inventorydb TO inventoryservice;