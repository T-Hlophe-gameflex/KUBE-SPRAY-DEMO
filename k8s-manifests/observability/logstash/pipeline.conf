input {
  beats {
    port => 5044
  }
}

filter {
  # Extract Kubernetes metadata from filebeat
  if [kubernetes] {
    # Store namespace for indexing
    mutate {
      add_field => { "k8s_namespace" => "%{[kubernetes][namespace]}" }
      add_field => { "k8s_pod" => "%{[kubernetes][pod][name]}" }
      add_field => { "k8s_container" => "%{[kubernetes][container][name]}" }
      add_field => { "k8s_node" => "%{[kubernetes][node][name]}" }
    }
    
    # Copy labels
    if [kubernetes][labels] {
      mutate {
        add_field => { "k8s_labels" => "%{[kubernetes][labels]}" }
      }
    }
  } else {
    # If kubernetes metadata is missing, try to extract from log path
    # Path format: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<id>.log
    if [log][file][path] {
      grok {
        match => { 
          "[log][file][path]" => "/var/log/pods/%{DATA:k8s_namespace}_%{DATA:k8s_pod}_%{DATA:pod_uid}/%{DATA:k8s_container}/%{NUMBER}.log"
        }
        tag_on_failure => ["_no_k8s_metadata"]
      }
      
      # Also try to extract from agent hostname
      if [agent][name] {
        mutate {
          add_field => { "k8s_node" => "%{[agent][name]}" }
        }
      }
    }
  }
  
  # Set default namespace if still missing
  if ![k8s_namespace] {
    mutate {
      add_field => { "k8s_namespace" => "unknown" }
    }
  }
  
  # Parse JSON logs if present
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }
  
  # Try to extract log level
  grok {
    match => { 
      "message" => [
        "(?<log_level>DEBUG|INFO|WARN|ERROR|FATAL)",
        "\[%{LOGLEVEL:log_level}\]",
        "%{LOGLEVEL:log_level}:"
      ]
    }
    tag_on_failure => []
  }
  
  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Copy relevant fields to top level for easier Kibana viewing
  if [parsed] {
    mutate {
      add_field => { "[log_source]" => "parsed_json" }
    }
  }
  
  # Remove unnecessary fields to reduce field count and index bloat
  mutate {
    remove_field => [
      # Remove beat agent metadata (not needed for log analysis)
      "agent",
      "ecs",
      "host",
      
      # Remove raw Kubernetes objects (we extracted what we need)
      "kubernetes",
      "orchestrator",
      
      # Remove file metadata (we have the log path if needed)
      "log",
      "input",
      "stream",
      
      # Remove container runtime details
      "container",
      
      # Remove labels (we have k8s_labels if needed)
      "labels",
      
      # Remove event original if we parsed JSON
      "[event][original]",
      
      # Remove collection metadata
      "collection_type",
      "namespace",
      "node_name",
      "container_name",
      "pod_name",
      "pod_uid",
      
      # Remove parsed monitoring metrics (too nested, causes field explosion)
      "[parsed][monitoring]",
      "[json][monitoring]",
      
      # Remove nested service fields that cause mapping conflicts
      # (service.name in JSON becomes nested object, conflicts with text field)
      "[parsed][service]",
      "[json][service]",
      "[parsed][service.name]",
      "[json][service.name]"
    ]
  }
}

output {
  # Write to namespace-specific index
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "kubernetes-logs-%{[k8s_namespace]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
  
  # Write to consolidated index
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "kubespray-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
