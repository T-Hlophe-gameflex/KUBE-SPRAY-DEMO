apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: monitoring
  labels:
    app: logstash
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
      # Parse JSON logs
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
          target => "log_json"
        }
      }
      
      # Extract Kubernetes metadata from filebeat
      if [kubernetes] {
        mutate {
          rename => {
            "[kubernetes][namespace]" => "k8s_namespace"
            "[kubernetes][pod][name]" => "k8s_pod"
            "[kubernetes][container][name]" => "k8s_container"
            "[kubernetes][node][name]" => "k8s_node"
            "[kubernetes][labels]" => "k8s_labels"
          }
        }
      }
      
      # Parse container log format
      grok {
        match => { "message" => "^%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:log_level}" }
        tag_on_failure => ["_grok_parse_failure"]
      }
      
      # Add custom tags based on namespace
      if [k8s_namespace] == "backend" {
        mutate { add_tag => ["backend-service"] }
      } else if [k8s_namespace] == "frontend" {
        mutate { add_tag => ["frontend-service"] }
      } else if [k8s_namespace] == "notification" {
        mutate { add_tag => ["notification-service"] }
      } else if [k8s_namespace] == "monitoring" {
        mutate { add_tag => ["monitoring-system"] }
      }
      
      # Parse HTTP access logs
      grok {
        match => { "message" => "%{IPORHOST:client_ip} - - \[%{HTTPDATE:timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:request_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:http_status} %{NUMBER:bytes_sent}" }
        tag_on_failure => []
      }
    }

    output {
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        index => "k8s-logs-%{[k8s_namespace]}-%{+YYYY.MM.dd}"
        template_overwrite => true
        ilm_enabled => false
        manage_template => true
        template => '{
          "index_patterns": ["k8s-logs-*"],
          "settings": {
            "number_of_shards": 1,
            "number_of_replicas": 0
          }
        }'
      }
      stdout {
        codec => rubydebug {
          metadata => true
        }
      }
    }
