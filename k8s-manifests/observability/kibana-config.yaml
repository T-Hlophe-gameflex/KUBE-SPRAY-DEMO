apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: monitoring
data:
  kibana.yml: |
    server.host: "0.0.0.0"
    server.shutdownTimeout: "5s"
    elasticsearch.hosts: [ "http://elasticsearch:9200" ]
    # For Kibana 8.x: Remove xpack.security.enabled (deprecated)
    # Security is managed through elasticsearch settings
    xpack.encryptedSavedObjects.encryptionKey: "fhjskloppd678ehkdfdlliverpoolfcr"
    xpack.reporting.encryptionKey: "fhjskloppd678ehkdfdlliverpoolfcr"
    # Kubernetes log dashboards defaults
    telemetry.enabled: false
    telemetry.optIn: false
